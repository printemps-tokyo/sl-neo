name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all
      - run: cargo build --release
      # Not a terminal here, so each train is printed once, without animation.
      - run: ./target/release/sl-neo --list
        shell: bash
      - run: for t in $(./target/release/sl-neo --list --names); do ./target/release/sl-neo --train "$t" --color never; done
        shell: bash
      # Every train file passes the checks a contribution must pass.
      - run: for f in vehicles/*.txt; do ./target/release/sl-neo --check "$f"; done
        shell: bash
      # A pseudo-terminal: terminal restore on every exit, Ctrl+C, signals.
      # Python's pty module is Unix only.
      - if: runner.os != 'Windows'
        run: python3 tests/pty_check.py target/release/sl-neo

  # The oldest Rust this crate promises to build with (rust-version in
  # Cargo.toml). A dependency update that needs a newer one fails here.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The version goes in `toolchain` on @master (the action's README), not
      # in the ref: Dependabot would "update" a ref like @1.88 to the newest.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85"
      - run: cargo test --locked --all
