name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all
      - run: cargo build --release
      # Not a terminal here, so each train is printed once, without animation.
      - run: ./target/release/sl-neo --list
      - run: for t in $(./target/release/sl-neo --list --names); do ./target/release/sl-neo --train "$t" --color never; done
      # A pseudo-terminal: terminal restore on every exit, Ctrl+C, signals.
      - run: python3 tests/pty_check.py target/release/sl-neo
