[package]
name = "sl-neo"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A modern sl: mistype ls and a shinkansen, Doctor Yellow, a Yamanote Line train, a steam locomotive or a maglev runs across your terminal in 24-bit color. Trains are plain-text art files."
authors = ["printemps.tokyo <develop@printemps.tokyo>"]
repository = "https://github.com/printemps-tokyo/sl-neo"
homepage = "https://github.com/printemps-tokyo/sl-neo"
readme = "README.md"
keywords = ["sl", "joke", "terminal", "train", "ascii-art"]
categories = ["command-line-utilities", "games"]

[[bin]]
name = "sl-neo"
path = "src/main.rs"

[lib]
name = "sl_neo"
path = "src/lib.rs"

[dependencies]
# Error context for the thin binary layer (org convention).
anyhow = "1"
# Argument parsing (derive API, org convention).
clap = { version = "4", features = ["derive"] }
# Raw mode, the alternate screen, terminal size and key events, portably.
crossterm = "0.29"
# Column width of the Japanese delay board text.
unicode-width = "0.2"

[target.'cfg(unix)'.dependencies]
# SIGTERM/SIGHUP/SIGINT become a flag the loop checks, so the terminal is
# restored (raw mode off, main screen back) before the process exits.
signal-hook = "0.4"

[profile.release]
strip = true
lto = true
codegen-units = 1

[dev-dependencies]
# The tests measure rows of the drawn screen in terminal columns.
unicode-width = "0.2"
